<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From ARPANET to the Internet in Greece - Interactive Quiz</title>
<style>
:root{--bg:#071923;--panel:#0d2a38;--panel2:#123746;--text:#f7fbfd;--muted:#b9d0da;--accent:#ff9d24;--ok:#3ddc97;--bad:#ff6b6b;--line:#2a5363;}
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#061923,#0a2633);color:var(--text);overflow:hidden}
button{font:inherit}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:#071923dd;gap:18px}
.brand small{display:block;color:var(--muted);font-size:clamp(12px,1.4vw,18px);letter-spacing:.06em} .brand strong{font-size:clamp(18px,2vw,30px)}
.tools{display:flex;gap:10px;flex-wrap:wrap} .tools button,.nav button{background:#173e4e;color:#fff;border:1px solid #376778;border-radius:12px;padding:10px 14px;cursor:pointer}
.tools button:hover,.nav button:hover{filter:brightness(1.12)}
main{display:flex;align-items:center;justify-content:center;padding:22px;min-height:0}
.card{width:min(1180px,96vw);max-height:100%;background:rgba(13,42,56,.96);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 60px #0006;padding:clamp(20px,3vw,42px);display:flex;flex-direction:column;gap:18px;overflow:auto}
.meta{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:clamp(14px,1.5vw,20px)} .pill{background:#173e4e;padding:7px 12px;border-radius:999px;color:#dff4ff}
h1{font-size:clamp(28px,4vw,54px);line-height:1.08;margin:0} h2{font-size:clamp(24px,3.2vw,44px);line-height:1.15;margin:0}
.intro p{font-size:clamp(18px,2vw,28px);line-height:1.4;color:#d8e9ef} .start{align-self:flex-start;background:var(--accent);color:#14212a;border:0;border-radius:16px;padding:15px 24px;font-weight:700;font-size:clamp(18px,2vw,28px);cursor:pointer}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px} .option{text-align:left;background:#123746;color:#fff;border:2px solid #2b5b6d;border-radius:18px;padding:18px 20px;font-size:clamp(18px,2.05vw,30px);line-height:1.23;cursor:pointer;min-height:88px;display:flex;align-items:center;gap:14px}
.option .letter{flex:0 0 auto;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#0a2532;color:#ffd19a;font-weight:700} .option:hover:not(:disabled){border-color:#68a9c2;transform:translateY(-1px)}
.option.selected{border-color:var(--accent);box-shadow:0 0 0 2px #ff9d2438} .option.correct{border-color:var(--ok);background:#123f35} .option.wrong{border-color:var(--bad);background:#4a252d} .option:disabled{cursor:default;opacity:.98}
.feedback{display:none;border-radius:16px;padding:14px 18px;font-size:clamp(17px,1.8vw,25px);line-height:1.35} .feedback.show{display:block} .feedback.ok{background:#123f35;border:1px solid #2e9a70} .feedback.bad{background:#4a252d;border:1px solid #a94c58}
.actionrow{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap} .next,.restart{background:#e8f6fb;color:#0b2632;border:0;border-radius:14px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:clamp(16px,1.7vw,24px)} .restart{background:var(--accent)}
.progresswrap{height:8px;background:#153846;border-radius:999px;overflow:hidden} .progress{height:100%;background:var(--accent);width:0;transition:width .25s ease}
footer{padding:10px 20px;color:#95b8c6;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;font-size:13px;background:#071923dd}
.resultGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px} .stat{background:#123746;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center} .stat strong{display:block;font-size:clamp(28px,4vw,52px);color:#ffd19a} .stat span{color:var(--muted);font-size:clamp(14px,1.4vw,19px)}
.review{display:grid;gap:8px} .review div{background:#102f3d;border-radius:12px;padding:10px 12px;font-size:16px} .review .r-ok{border-left:5px solid var(--ok)} .review .r-bad{border-left:5px solid var(--bad)}
@media(max-width:800px){.options{grid-template-columns:1fr} header{padding:10px 14px} main{padding:10px} .card{border-radius:16px;padding:18px} footer{display:none} .option{min-height:64px}}
@media print{body{overflow:visible}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><small>SENIOR VOCATIONAL SCHOOL · ENGLISH</small><strong>From ARPANET to the Internet in Greece</strong></div><div class="tools"><button onclick="toggleFS()">Full screen</button><button onclick="resetQuiz()">Reset</button></div></header>
<main><section class="card" id="card"></section></main>
<footer><span>Evangelia Domvrou - Teacher of English Language and Literature</span><span>Interactive board quiz · 20 questions</span></footer>
</div>
<script>
const questions = [{"cat": "Comprehension", "q": "What is the main difference between the Internet and the World Wide Web?", "opts": ["The Internet is a worldwide network of interconnected networks; the Web is a service of linked pages and resources that runs on it.", "The Web connects computers physically, while the Internet is only a collection of pages.", "They are two names for exactly the same thing.", "The Internet is a browser, while the Web is a protocol."], "ans": 0, "fb": "The Internet is the network infrastructure and shared protocols; the Web is one service that uses that Internet infrastructure.", "id": 1}, {"cat": "Comprehension", "q": "What happened in October 1969?", "opts": ["CERN placed Web software in the public domain.", "Greece connected to EARN/BITNET.", "The first ARPANET link joined UCLA and the Stanford Research Institute.", "ARPANET moved to TCP/IP."], "ans": 2, "fb": "The first ARPANET link connected UCLA and SRI in October 1969.", "id": 2}, {"cat": "Comprehension", "q": "Why was TCP/IP important to the development of the modern Internet?", "opts": ["It created the first personal computer.", "It allowed different networks and devices to exchange data using shared rules.", "It replaced all routers with mainframes.", "It made email unnecessary."], "ans": 1, "fb": "TCP/IP provided shared communication rules so different networks could interconnect and exchange data.", "id": 3}, {"cat": "Comprehension", "q": "What key change took place on 1 January 1983?", "opts": ["ARPANET connected its first four hosts.", "The first Web browser was released.", "The .gr domain began operating.", "ARPANET moved to TCP/IP."], "ans": 3, "fb": "On 1 January 1983, ARPANET adopted TCP/IP, a major milestone in the modern Internet.", "id": 4}, {"cat": "Comprehension", "q": "What did Tim Berners-Lee propose at CERN in 1989?", "opts": ["The first email system.", "The World Wide Web, to link research information.", "The ARIADNE network.", "The IBM 650."], "ans": 1, "fb": "Berners-Lee proposed the Web at CERN in 1989 as a way to link research information.", "id": 5}, {"cat": "Comprehension", "q": "Which statement about the first documented computer in Greece is accurate?", "opts": ["An IBM 650 was installed at the National Bank of Greece in 1959, but it was not connected to the Internet.", "It was a personal computer installed in a Greek home in 1959.", "It was the first Greek Internet server and used TCP/IP.", "It was installed at CERN and later moved to Greece."], "ans": 0, "fb": "The IBM 650 installed at the National Bank of Greece in 1959 was a large institutional computer, not an Internet-connected machine.", "id": 6}, {"cat": "Comprehension", "q": "What happened in Greece in 1988?", "opts": ["Public Web access became available in every household.", "The .gr domain was replaced by .eu.", "GRNET began operating.", "The University of Athens connected to EARN/BITNET via a national node at the University of Crete."], "ans": 3, "fb": "In 1988 the University of Athens connected to EARN/BITNET through a national node at the University of Crete.", "id": 7}, {"cat": "Comprehension", "q": "Why should the 1988 EARN/BITNET connection not be described as the first public Internet connection in Greece?", "opts": ["It was only a telephone service with no computers.", "It happened after household Internet access was already common.", "It was an early academic network connection and was not the same as wide public TCP/IP Internet access.", "It was a Web browser rather than a network."], "ans": 2, "fb": "EARN/BITNET was part of early academic networking. Wide public Internet access developed later.", "id": 8}, {"cat": "Comprehension", "q": "Which statement best describes Internet access in Greece during the early 1990s?", "opts": ["It was already universal in homes and businesses.", "It was mainly available through research and academic institutions before commercial providers expanded access.", "It was limited to the National Bank of Greece.", "It depended only on ARPANET, which was still operating."], "ans": 1, "fb": "In the early 1990s, access was mainly academic/research-based; commercial providers later widened access.", "id": 9}, {"cat": "Comprehension", "q": "What similarity did the global and Greek Internet timelines share?", "opts": ["Both began with public Web browsing in 1959.", "Both adopted the .gr domain in 1989.", "Both ended academic networking in 1990.", "Researchers and universities gained network access before most households."], "ans": 3, "fb": "In both histories, research and academic institutions were connected before most households.", "id": 10}, {"cat": "Vocabulary", "q": "Which term means a small unit of data sent across a network?", "opts": ["router", "browser", "packet", "mainframe"], "ans": 2, "fb": "A packet is a small unit of data transmitted across a network.", "id": 11}, {"cat": "Vocabulary", "q": "Which term means the agreed rules used for exchanging data?", "opts": ["protocol", "bandwidth", "website", "client"], "ans": 0, "fb": "A protocol is a set of agreed rules for data exchange.", "id": 12}, {"cat": "Vocabulary", "q": "Which device forwards packets between networks?", "opts": ["server", "browser", "host name", "router"], "ans": 3, "fb": "A router forwards packets from one network toward another.", "id": 13}, {"cat": "Vocabulary", "q": "What is an IP address?", "opts": ["A clickable link to another resource.", "A number that identifies a device or interface on a network.", "A company that provides Internet access.", "A collection of related Web pages."], "ans": 1, "fb": "An IP address identifies a device or network interface for Internet Protocol communication.", "id": 14}, {"cat": "Vocabulary", "q": "Which term means text that contains links to other information?", "opts": ["infrastructure", "bandwidth", "hypertext", "packet switching"], "ans": 2, "fb": "Hypertext is text containing links to other information or resources.", "id": 15}, {"cat": "Vocabulary", "q": "Which term means an application used to view Web resources?", "opts": ["browser", "server", "protocol", "ISP"], "ans": 0, "fb": "A browser is an application used to open and view Web resources.", "id": 16}, {"cat": "Vocabulary", "q": "What does ISP stand for?", "opts": ["Internet System Protocol", "Internet Service Provider", "International Server Program", "Integrated Service Packet"], "ans": 1, "fb": "ISP stands for Internet Service Provider, a company that provides Internet access.", "id": 17}, {"cat": "Vocabulary", "q": "Which term describes the amount of data a connection can carry per unit of time?", "opts": ["domain name", "hyperlink", "public domain", "bandwidth"], "ans": 3, "fb": "Bandwidth refers to the amount of data a connection can carry per unit of time.", "id": 18}, {"cat": "Vocabulary", "q": "Which term refers to a readable Internet name such as example.gr?", "opts": ["IP packet", "mainframe", "domain name", "academic network"], "ans": 2, "fb": "A domain name is a readable Internet name, such as example.gr.", "id": 19}, {"cat": "Vocabulary", "q": "Which term means the equipment and systems that support a network?", "opts": ["access", "infrastructure", "email", "client"], "ans": 1, "fb": "Infrastructure is the underlying equipment and systems that support a network.", "id": 20}];
let idx=-1, selected=null, answered=false, score=0, results=[];
const card=document.getElementById('card');
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function start(){idx=0;score=0;results=[];renderQ()}
function renderIntro(){card.innerHTML=`<div class="intro"><div class="meta"><span class="pill">Interactive board mode</span><span>10 comprehension + 10 vocabulary</span></div><h1>Internet History & Vocabulary Quiz</h1><p>One question appears on each screen. <strong>As soon as you choose an answer, it is checked automatically.</strong> Correct/incorrect feedback and the explanation appear immediately on the same screen. Then move to the next question.</p><p><strong>Keyboard:</strong> 1-4 choose and check instantly · Enter moves to the next question after answering · F enters full screen.</p><button class="start" onclick="start()">Start quiz</button></div>`}
function renderQ(){selected=null;answered=false;const q=questions[idx];const letters=['A','B','C','D'];card.innerHTML=`<div class="meta"><span class="pill">${q.cat}</span><span>Question ${idx+1} / ${questions.length}</span></div><div class="progresswrap"><div class="progress" style="width:${(idx/questions.length)*100}%"></div></div><h2>${esc(q.q)}</h2><div class="options">${q.opts.map((o,i)=>`<button class="option" data-i="${i}" onclick="choose(${i})"><span class="letter">${letters[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actionrow"><span id="status" style="color:var(--muted)">Choose one answer. It will be checked immediately.</span><div><button id="next" class="next" onclick="nextQ()" style="display:none">${idx===questions.length-1?'See results':'Next question'}</button></div></div>`}
function choose(i){if(answered)return;selected=i;answered=true;const q=questions[idx], ok=selected===q.ans;if(ok)score++;results.push({ok,selected});document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;b.classList.remove('selected');if(j===q.ans)b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(ok?'ok':'bad');f.innerHTML=`<strong>${ok?'Correct!':'Not quite.'}</strong> ${esc(q.fb)}`;document.getElementById('next').style.display='inline-block';document.getElementById('status').textContent=`Score so far: ${score} / ${idx+1}`;document.getElementById('next').focus();}
function nextQ(){if(!answered)return;if(idx===questions.length-1) return renderResults();idx++;renderQ()}
function renderResults(){const comp=results.slice(0,10).filter(r=>r.ok).length;const vocab=results.slice(10).filter(r=>r.ok).length;card.innerHTML=`<div class="meta"><span class="pill">Finished</span><span>20 / 20 questions</span></div><div class="progresswrap"><div class="progress" style="width:100%"></div></div><h1>Quiz complete</h1><div class="resultGrid"><div class="stat"><strong>${score}/20</strong><span>Total score</span></div><div class="stat"><strong>${comp}/10</strong><span>Comprehension</span></div><div class="stat"><strong>${vocab}/10</strong><span>Vocabulary</span></div></div><h2 style="font-size:28px">Review</h2><div class="review">${questions.map((q,i)=>`<div class="${results[i].ok?'r-ok':'r-bad'}">${i+1}. ${esc(q.q)} — <strong>${results[i].ok?'Correct':'Review needed'}</strong></div>`).join('')}</div><div class="actionrow"><button class="restart" onclick="resetQuiz()">Try again</button><span>Use the printable PDF for the full question-and-answer sheet.</span></div>`}
function resetQuiz(){idx=-1;selected=null;answered=false;score=0;results=[];renderIntro()}
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')toggleFS();if(idx>=0&&idx<questions.length){if(['1','2','3','4'].includes(e.key)&&!answered)choose(Number(e.key)-1);if(e.key==='Enter'&&answered)nextQ();}})
renderIntro();
</script>
</body></html>
