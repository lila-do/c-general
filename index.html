<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14134b"><title>Safe Internet & AI · Classroom Quest</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;background:#151447;color:#13213b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 12%,#4235ae 0,transparent 31%),radial-gradient(circle at 95% 90%,#0b8398 0,transparent 31%),#151447}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #ffe245;outline-offset:3px}.app{max-width:1450px;min-height:100vh;margin:auto;padding:15px 23px;display:flex;flex-direction:column;gap:12px}.header{display:flex;justify-content:space-between;align-items:center;color:white;gap:16px}.logo{font-size:clamp(1rem,2.1vw,1.55rem);font-weight:900;letter-spacing:.02em}.subtitle{font-size:.9rem;color:#dcf9ff;margin-top:4px}.controls{display:flex;gap:8px}.control{border:2px solid #ffffff70;color:white;background:#ffffff23;border-radius:100px;padding:8px 15px;font-size:.92rem;font-weight:800}.progressLine{display:flex;align-items:center;gap:12px;color:white;font-weight:900}.chip{white-space:nowrap;background:#ffffff20;border-radius:100px;padding:9px 15px}.track{flex:1;height:14px;background:#ffffff3c;border-radius:100px;overflow:hidden}.meter{height:100%;width:0;background:linear-gradient(90deg,#28e3c6,#ffdf44,#ff5b9a);transition:width .3s}.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(290px,38%) 1fr;border-radius:27px;overflow:hidden;background:#fff;box-shadow:0 22px 60px #07082cbb}.art{position:relative;background:linear-gradient(145deg,#126c9a,#4c2ea5);min-height:250px;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover;display:block}.art::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#151549ee)}.artLabel{position:absolute;bottom:27px;left:27px;right:20px;z-index:1;color:white;font-size:clamp(1.7rem,2.9vw,2.9rem);line-height:1.05;font-weight:900}.panel{padding:clamp(23px,3vw,42px);display:flex;flex-direction:column;min-height:0}.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.label{background:#d9f8f3;color:#006e70;padding:9px 14px;border-radius:100px;text-transform:uppercase;font-weight:900;letter-spacing:.055em;font-size:.82rem}.label.vocab{background:#ffe6f0;color:#aa1851}.topic{color:#575e7b;font-weight:800;font-size:.9rem}.prompt{font-size:clamp(1.6rem,2.75vw,2.7rem);font-weight:900;line-height:1.16;color:#15234a;margin:18px 0 22px}.options{display:grid;gap:10px}.option{display:flex;align-items:center;text-align:left;gap:15px;width:100%;min-height:66px;border:3px solid #e2e9f6;background:#f5f8ff;border-radius:17px;color:#15234a;padding:12px 16px;font-size:clamp(1.08rem,1.74vw,1.5rem);font-weight:800;transition:transform .15s,border-color .15s}.option:hover:not(:disabled){border-color:#0ab2bb;transform:translateX(5px)}.option span:first-child{display:grid;place-items:center;flex:none;width:39px;height:39px;border-radius:10px;background:#33439b;color:white;font-size:1.15rem}.option.right{border-color:#1ca96f;background:#dcffea}.option.wrong{border-color:#e64e76;background:#ffe3ec}.option:disabled{cursor:default}.bottom{margin-top:auto;padding-top:16px;min-height:74px;display:flex;align-items:center;gap:15px}.feedback{font-size:clamp(1rem,1.55vw,1.22rem);font-weight:800;line-height:1.3;flex:1}.action{border:0;border-radius:16px;background:#ffdd3d;color:#14194d;padding:15px 24px;font-weight:900;font-size:1.16rem;box-shadow:0 5px 0 #eaa21b}.action:hover{background:#ffed83}.action:active{transform:translateY(4px);box-shadow:0 1px 0 #eaa21b}.welcome,.finish,.interlude{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;height:100%}.welcome h1,.finish h1,.interlude h1{font-size:clamp(2.3rem,4.1vw,4.6rem);line-height:1.06;color:#182655;margin:16px 0}.welcome p,.finish p,.interlude p{font-size:clamp(1.1rem,1.8vw,1.45rem);line-height:1.45;max-width:720px}.results{display:flex;gap:13px;flex-wrap:wrap;margin:8px 0 24px}.result{background:#ebf3ff;border-radius:16px;padding:15px 20px;font-weight:900;color:#183971}.result b{display:block;font-size:2rem;color:#087f83}.byline{font-size:.82rem;color:#deebff;text-align:center}.spark{position:fixed;top:-20px;left:0;width:11px;height:18px;z-index:10;pointer-events:none;animation:fall 1.5s forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(720deg);opacity:0}}@media(max-width:850px){.app{padding:10px;gap:9px}.stage{display:flex;flex-direction:column}.art{height:140px;min-height:140px}.artLabel{bottom:12px;left:16px;font-size:1.6rem}.panel{padding:16px;flex:1}.prompt{margin:10px 0 15px}.option{min-height:54px;padding:7px 9px}.bottom{min-height:60px}.subtitle{display:none}.progressLine{flex-wrap:wrap}.track{order:3;flex-basis:100%}}@media(max-height:730px) and (min-width:851px){.app{padding:8px 14px;gap:7px}.panel{padding:18px 26px}.prompt{font-size:2rem;margin:10px 0}.options{gap:7px}.option{min-height:53px;font-size:1.13rem;padding:7px 12px}.bottom{padding-top:8px;min-height:54px}.byline{font-size:.7rem}}
</style></head><body><main class="app"><header class="header"><div><div class="logo">SAFE INTERNET & AI · CLASSROOM QUEST</div><div class="subtitle">Learn to pause, check and decide</div></div><div class="controls"><button class="control" id="sound" aria-label="Turn sound off">Sound on</button><button class="control" id="full">Full screen</button></div></header><div class="progressLine"><span class="chip" id="round">Ready</span><div class="track" aria-label="Quiz progress"><div class="meter" id="meter"></div></div><span class="chip" id="counter">0 / 40</span><span class="chip" id="points">0 points</span></div><section class="stage"><div class="art"><img id="artImage" src="assets/safe-decisions.webp" alt="Colourful illustration of teenagers using digital tools carefully"><div class="artLabel" id="artLabel">Think before you trust.</div></div><div class="panel" id="panel" aria-live="polite"></div></section><div class="byline">Evangelia Domvrou, Teacher of English Language and Literature</div></main><script src="questions.js"></script><script>
'use strict';
const positions=[2,0,1,2,1,0,2,0,1,1,2,0,1,2,0,2,1,0,2,1, 1,2,0,1,0,2,1,0,2,1,0,2,1,2,0,1,2,0,1,2];
questions.forEach((o,i)=>{const k=positions[i];o.options=[...o.options.slice(3-k),...o.options.slice(0,3-k)];o.answer=k});
const $=id=>document.getElementById(id);let index=-1,score=0,comprehension=0,vocabulary=0,locked=false,muted=false,ctx;
function photo(kind){$('artImage').src='assets/'+(kind==='vocab'?'verify-ai-media.webp':'safe-decisions.webp');$('artImage').alt=kind==='vocab'?'Illustration about checking AI and media information':'Illustration about safe digital decisions';$('artLabel').textContent=kind==='vocab'?'Words give you power.':'Think before you trust.'}
function progress(){let n=Math.max(index,0);$('meter').style.width=(n/questions.length*100)+'%';$('counter').textContent=n+' / '+questions.length;$('points').textContent=score+' point'+(score===1?'':'s');$('round').textContent=index<0?'Ready':index>=questions.length?'Finished':index<20?'Round 1 · Decisions':'Round 2 · Vocabulary'}
function sound(ok){if(muted)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();(ok?[523,659,784]:[350,270]).forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.095;o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.075,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.19)})}catch(e){}}
function celebrate(){for(let i=0;i<22;i++){let x=document.createElement('i');x.className='spark';x.style.left=Math.random()*100+'vw';x.style.background=['#ffe33f','#21d9bf','#fa5b92','#8f71ff'][i%4];x.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.append(x);setTimeout(()=>x.remove(),1700)}}
function intro(){index=-1;score=0;comprehension=0;vocabulary=0;photo('decisions');progress();$('panel').innerHTML='<div class="welcome"><span class="label">Two rounds · 40 questions</span><h1>Can you spot the safer choice?</h1><p>Round 1 has 20 everyday decisions about online life and AI. Round 2 is a 20-word vocabulary sprint. Choose A, B or C and see why it matters.</p><button class="action" id="begin">Start the quest</button></div>';$('begin').onclick=()=>{index=0;show()}}
function show(){locked=false;progress();let o=questions[index],isVocab=index>=20;photo(isVocab?'vocab':'decisions');$('panel').innerHTML='<div class="meta"><span class="label '+(isVocab?'vocab':'')+'">'+(isVocab?'Vocabulary sprint':'Everyday decision')+'</span><span class="topic">'+o.topic+' · '+(index+1)+' / 40</span></div><h1 class="prompt">'+o.q+'</h1><div class="options">'+o.options.map((v,k)=>'<button class="option" data-choice="'+k+'"><span>'+String.fromCharCode(65+k)+'</span><span>'+v+'</span></button>').join('')+'</div><div class="bottom"><div class="feedback" id="feedback" role="status">Choose an answer to see the explanation.</div><button class="action" id="next" hidden>Next</button></div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));$('next').onclick=next}
function choose(k){if(locked)return;locked=true;let o=questions[index],ok=k===o.answer;if(ok){score++;if(index<20)comprehension++;else vocabulary++;if((index+1)%5===0)celebrate()}sound(ok);document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===o.answer)b.classList.add('right');else if(i===k)b.classList.add('wrong')});$('feedback').textContent=(ok?'Exactly! ':'Good try. ')+o.why;$('next').hidden=false;$('next').textContent=index===19?'Vocabulary round':index===39?'See results':'Next';progress()}
function next(){if(!locked)return;index++;if(index===20)interlude();else if(index>=questions.length)finish();else show()}
function interlude(){locked=false;photo('vocab');progress();$('panel').innerHTML='<div class="interlude"><span class="label vocab">Round 1 complete</span><h1>Vocabulary sprint!</h1><p>You scored '+comprehension+' / 20 on everyday decisions. Now match 20 essential English terms with their meanings. The explanation also gives the Greek translation.</p><button class="action" id="continue">Start vocabulary</button></div>';$('continue').onclick=show;celebrate()}
function finish(){progress();$('meter').style.width='100%';$('counter').textContent='40 / 40';photo('vocab');$('artLabel').textContent='Keep your judgement in control.';let headline=score>=34?'Excellent digital judgement!':score>=25?'Great work. Keep checking!':'Every safer choice is progress.';$('panel').innerHTML='<div class="finish"><span class="label vocab">Quest complete</span><h1>'+headline+'</h1><div class="results"><div class="result">Total<b>'+score+' / 40</b></div><div class="result">Decisions<b>'+comprehension+' / 20</b></div><div class="result">Vocabulary<b>'+vocabulary+' / 20</b></div></div><p>Pause before you click, post, pay or prompt. Use what you learned to protect yourself and others.</p><button class="action" id="again">Play again</button></div>';$('again').onclick=intro;celebrate()}
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'Sound off':'Sound on';$('sound').setAttribute('aria-label',muted?'Turn sound on':'Turn sound off')};$('full').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};document.addEventListener('keydown',e=>{if(index<0&&e.key==='Enter')$('begin')?.click();else if(index===20&&!locked&&e.key==='Enter')$('continue')?.click();else if(index>=0&&index<questions.length){let k=['1','2','3'].indexOf(e.key);if(k<0)k=['a','b','c'].indexOf(e.key.toLowerCase());if(!locked&&k>=0)choose(k);else if(locked&&e.key==='Enter')next()}});intro();
</script></body></html>
